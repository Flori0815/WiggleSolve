name: Integration Tests

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run JS integration tests
        run: npm run test -w wigglesolve-integration-js

      - name: Install Python test dependency
        run: pip install pytest

      - name: Run Python integration tests
        working-directory: test-suite/py
        run: pytest -v
