name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Core unit tests (100% coverage gate)
        run: npm run test:coverage -w @wigglesolve/core

      - name: JS integration tests
        run: npm test -w wigglesolve-integration-js

      - name: Install Python test dependency
        run: pip install pytest

      - name: Python unit and integration tests
        run: npm run test:py
